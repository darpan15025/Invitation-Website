name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main
      - cursor/royal-wedding-invitation-dc4d
  workflow_dispatch:

jobs:
  verify-static-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify invitation assets
        run: |
          test -f index.html
          test -f css/main.css
          test -f js/app.js
          test -f js/scratch.js
          test -f js/effects.js
          echo "Static site files OK (ready for Cloudflare Pages)."

  deploy:
    needs: verify-static-site
    if: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4
      - name: Publish to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy . --project-name=tanya-prabhat-wedding --branch=${{ github.ref_name }}

  deploy-not-configured:
    needs: verify-static-site
    if: ${{ secrets.CLOUDFLARE_API_TOKEN == '' || secrets.CLOUDFLARE_ACCOUNT_ID == '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Cloudflare deploy skipped
        run: |
          echo "::notice::Deploy skipped — add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID in repo Settings → Secrets → Actions,"
          echo "::notice::or connect the repo in Cloudflare Dashboard → Workers & Pages → Create → Connect Git."