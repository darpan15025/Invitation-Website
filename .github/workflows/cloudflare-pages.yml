name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  verify-static-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify invitation assets
        run: |
          test -f index.html
          test -f css/main.css
          test -f js/app.js
          test -f js/scratch.js
          test -f js/effects.js
          echo "Static site files OK (ready for Cloudflare Pages)."

  deploy:
    needs: verify-static-site
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to Cloudflare or skip
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::Cloudflare secrets not set — skip deploy. Live site: https://raw.githack.com/darpan15025/Invitation-Website/main/index.html"
            exit 0
          fi
          npm i wrangler@3.90.0
          npx wrangler pages deploy . --project-name=tanya-prabhat-wedding --branch="${GITHUB_REF_NAME}"